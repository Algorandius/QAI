name: check

# 只做三件成本很低、但能挡住大坑的事：
#   1. 语法/导入层面的编译检查
#   2. 纯函数单元测试
#   3. 代码读取的配置键 vs .env 模板（发 1.1.0 时漏了 LLM_KEY_* 就是这类问题）
#
# 不在 CI 里打便携包：需要 Windows + csc.exe + 便携 Python，交给本地构建。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试所需依赖
        run: |
          python -m pip install --upgrade pip
          # 不装 pythonnet / pywebview：它们只在 Windows 打包时用，Linux 上装不上
          python -m pip install \
            "nonebot2>=2.3.0" \
            "nonebot-adapter-onebot>=2.4.0" \
            "httpx>=0.27.0" \
            "python-dotenv>=1.0.0" \
            "websockets>=12.0" \
            "PyYAML>=6.0"

      - name: 编译检查
        run: |
          python -m compileall -q src launcher.py stop.py build_portable.py qai_window.py bot.py tools

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 配置键一致性
        run: python tools/check_env_keys.py

      - name: 敏感信息扫描（防再次把作者配置带进包）
        run: python tools/check_secrets.py
