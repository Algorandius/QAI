# QAI 依赖锁 —— 2026-10-24 从 .venv 导出（pip freeze）
#
# 为什么需要它：
# requirements.txt 里全是 ">=" 下限，重建便携包时装到的版本可能已经变了，
# 于是「同一个版本号打出来的包」行为不一致。构建时用这份清单核对实际版本。
#
# 重新生成：
#   .venv\Scripts\python.exe -m pip freeze > requirements.lock
# 升级某个库后记得一起提交，否则 CI 的锁校验会报差异。

